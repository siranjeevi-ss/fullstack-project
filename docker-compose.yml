services:

  frontend:
    build: ./frontend
    container_name: stackly-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: stackly-backend
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: mariadb:10.5
    container_name: stackly-db
    environment:
      MYSQL_DATABASE: companydb
      MYSQL_USER: stacklyuser
      MYSQL_PASSWORD: 'Stackly@123'
      MYSQL_ROOT_PASSWORD: 'Root@123'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
